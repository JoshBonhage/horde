# Claude Code screen manifest.
#
# This is the FALLBACK tier. Run `horde integration install claude` to wire up lifecycle
# hooks, which report state authoritatively and make everything below unnecessary.
#
# Patterns are single-quoted TOML literals so regex backslashes need no escaping.
# Matching is case-insensitive and `^`/`$` bind to line boundaries.
#
# Two things every pattern here has to survive:
#
# 1. **Truncation.** Claude elides its own status line to fit the pane, so at ~50 columns
#    `· esc to interrupt` renders as `· esc to inte…`. Match a short prefix, never the
#    whole phrase.
# 2. **Transcript history.** The snapshot covers the last ~40 lines, which includes what
#    Claude *said*, not just what it is doing. `within` restricts a rule to the bottom few
#    lines — the live status area — so a "Thinking…" from ten minutes ago cannot pin the
#    pane to `working` forever.

name = "claude"

# `claude` on disk is often a symlink to a versioned binary, so the process name alone is not
# dependable — though when `ps` does say `claude`, that beats any screen guess.
processes = ["claude"]

# Presence patterns must be unique to Claude. Anything generic ("esc to interrupt") is shared
# with other agents' UIs and would make two manifests claim the same pane.
detect = [
  'Claude Code',
  '\? for shortcuts',
  'shift\+tab to cycle',
  '⏵⏵',
]

# Blocked is checked first and kept deliberately strict: only a visible approval, question, or
# permission UI counts. Silence is never treated as blocked.
#
# `❯\s*\d+\.` matches a numbered selection menu, which is distinct from the bare `❯` input
# caret — matching the caret here would mark every idle pane as blocked.
[[rules]]
name = "blocked-permission"
state = "blocked"
any = [
  'Do you want to (proceed|continue|make this edit|create|run)',
  'Do you trust the files',
  'Would you like to proceed',
  '❯\s*\d+\.\s',
  'No, and tell Claude',
]

# VERIFIED: while a turn runs, `· esc to interrupt` is appended to the mode line at the very
# bottom and removed the moment it finishes. `within` pins this to that line so the words
# cannot be picked up from scrollback, and the pattern is short enough to survive elision.
[[rules]]
name = "working-esc-to-interrupt"
state = "working"
within = 4
any = ['esc to int']

# VERIFIED: at rest the composer is a bare `❯` line framed by rules, with the mode line
# beneath it and no interrupt hint.
[[rules]]
name = "idle-prompt"
state = "idle"
within = 6
any = [
  '^❯',
  'shift\+tab to cycle',
  '(auto mode|accept edits|plan mode) on',
  '\? for shortcuts',
]
