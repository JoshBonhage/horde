# OpenAI Codex CLI screen manifest.
#
# Untested locally — codex is not installed on this machine. `esc to interrupt` was
# removed from `detect`: Claude Code shows the same phrase, so it made both manifests claim
# the same pane and the winner was whichever the map happened to yield first.

name = "codex"
processes = ["codex"]

detect = [
  'Codex CLI',
  'OpenAI Codex',
  'codex --',
]

[[rules]]
name = "blocked-approval"
state = "blocked"
any = [
  'Allow command\?',
  'Do you want to allow',
  'Approve this',
  '\[y/n\]',
  '❯\s*1\.\s*Yes',
]

[[rules]]
name = "working"
state = "working"
within = 4
any = [
  'esc to interrupt',
  '\bWorking\b',
]

[[rules]]
name = "idle-prompt"
state = "idle"
any = [
  '^\s*│\s*>',
  'send a message',
]
