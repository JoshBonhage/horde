# OpenAI Codex CLI detection manifest.
#
# Untested locally — codex is not installed on this machine. Refine with
# `horde agent explain <pane>`, which prints the region slices and the rule that fired.
#
# `esc to interrupt` is deliberately absent from `detect`: Claude Code shows the same phrase,
# and a shared presence pattern makes two manifests claim one pane.

name = "codex"
processes = ["codex"]

# Presence patterns must be unique to this agent.
detect = [
  'Codex CLI',
  'OpenAI Codex',
  'codex --',
]

[[rules]]
id = "blocked_approval"
state = "blocked"
priority = 900
region = "whole_recent"
contains = ["allow command"]
any = [{ contains = ["y/n"] }, { line_regex = ['^\s*❯?\s*\d+\.\s*yes\b'] }]

[[rules]]
id = "status_line_working"
state = "working"
priority = 600
region = "bottom_non_empty_lines(3)"
any = [{ contains = ["esc to interrupt"] }, { contains = ["working"] }]

[[rules]]
id = "composer_idle"
state = "idle"
priority = 500
region = "prompt_box_body"
line_regex = ['^\s*[>❯]']
