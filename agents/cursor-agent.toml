# Cursor Agent CLI screen manifest. Untested locally.

name = "cursor-agent"
processes = ["cursor-agent"]

detect = [
  'Cursor Agent',
  'cursor-agent',
]

[[rules]]
name = "blocked-approval"
state = "blocked"
any = [
  'Run this command\?',
  'Do you want to',
  'Accept\b.*\?',
  '❯\s*1\.\s*Yes',
]

[[rules]]
name = "working"
state = "working"
within = 4
any = [
  'esc to interrupt',
  '\bGenerating\b',
]

[[rules]]
name = "idle-prompt"
state = "idle"
any = ['^\s*│\s*>', '^\s*>\s*$']
