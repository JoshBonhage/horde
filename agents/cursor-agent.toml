# Cursor Agent CLI detection manifest. Untested locally.

name = "cursor-agent"
processes = ["cursor-agent"]

# Presence patterns must be unique to this agent.
detect = [
  'Cursor Agent',
  'cursor-agent',
]

[[rules]]
id = "blocked_approval"
state = "blocked"
priority = 900
region = "whole_recent"
any = [{ contains = ["run this command?"] }, { contains = ["do you want to"], any = [{ line_regex = ['^\s*❯?\s*\d+\.\s*yes\b'] }] }]

[[rules]]
id = "status_line_working"
state = "working"
priority = 600
region = "bottom_non_empty_lines(3)"
any = [{ contains = ["esc to interrupt"] }, { contains = ["generating"] }]

[[rules]]
id = "composer_idle"
state = "idle"
priority = 500
region = "prompt_box_body"
line_regex = ['^\s*[>❯]']
