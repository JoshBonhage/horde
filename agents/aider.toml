# aider detection manifest. Untested locally.
#
# aider is prompt-driven rather than a full-screen TUI, so its blocked state is the more
# recognisable one — it asks explicit yes/no questions inline.

name = "aider"
processes = ["aider"]

# Presence patterns must be unique to this agent.
detect = [
  'aider v',
  'Added .* to the chat',
  'aider --',
]

[[rules]]
id = "blocked_question"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(6)"
any = [{ contains = ["(y)es/(n)o"] }, { contains = ["(y/n)"] }, { contains = ["apply edits?"] }, { contains = ["run shell command?"] }]

[[rules]]
id = "status_working"
state = "working"
priority = 600
region = "bottom_non_empty_lines(3)"
any = [{ contains = ["thinking"] }, { contains = ["applying edit"] }]

[[rules]]
id = "prompt_idle"
state = "idle"
priority = 500
region = "bottom_non_empty_lines(3)"
line_regex = ['^\s*>\s*$']
