# aider screen manifest. Untested locally.
#
# aider is prompt-driven rather than a full-screen TUI, so its blocked state is the more
# recognisable one — it asks explicit yes/no questions inline.

name = "aider"
processes = ["aider"]

detect = [
  'aider v',
  'Added .* to the chat',
  'aider --',
]

[[rules]]
name = "blocked-question"
state = "blocked"
any = [
  '\(Y\)es/\(N\)o',
  '\(y/n\)',
  'Add .* to the chat\?',
  'Apply edits\?',
  'Run shell command\?',
]

[[rules]]
name = "working"
state = "working"
within = 4
any = [
  '^\s*Thinking',
  'Applying edit',
]

[[rules]]
name = "idle-prompt"
state = "idle"
any = ['^\s*>\s*$', 'multi\. exit']
