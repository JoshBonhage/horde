# Gemini CLI screen manifest. Untested locally.

name = "gemini"
processes = ["gemini"]

detect = [
  'Gemini CLI',
  'gemini-2',
  'GEMINI\.md',
]

[[rules]]
name = "blocked-approval"
state = "blocked"
any = [
  'Allow execution',
  'Apply this change\?',
  'Do you want to',
  '❯\s*1\.\s*Yes',
]

[[rules]]
name = "working"
state = "working"
within = 4
any = [
  'esc to cancel',
  '\bThinking\b',
]

[[rules]]
name = "idle-prompt"
state = "idle"
any = [
  'Type your message',
  '^\s*│\s*>',
]
