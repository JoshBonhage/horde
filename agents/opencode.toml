# opencode detection manifest. Untested locally.
#
# A bare `opencode` is deliberately absent from `detect`: it would match any pane that merely
# mentioned the word, including one running a different agent.

name = "opencode"
processes = ["opencode"]

# Presence patterns must be unique to this agent.
detect = [
  'opencode v',
  'opencode --',
  'OpenCode',
]

[[rules]]
id = "blocked_approval"
state = "blocked"
priority = 900
region = "whole_recent"
any = [{ contains = ["y/n"] }, { contains = ["do you want to"], any = [{ line_regex = ['^\\s*❯?\\s*\\d+\\.\\s*yes\\b'] }] }]

[[rules]]
id = "status_line_working"
state = "working"
priority = 600
region = "bottom_non_empty_lines(3)"
any = [{ contains = ["esc to interrupt"] }, { contains = ["working"] }]

[[rules]]
id = "composer_idle"
state = "idle"
priority = 500
region = "prompt_box_body"
line_regex = ['^\\s*[>❯]']
